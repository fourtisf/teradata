# Reverse proxy for the Next server PM2 runs on 127.0.0.1:3000.
# Install:  cp deploy/nginx-tare.conf /etc/nginx/sites-available/tare
server {
    listen 80;
    listen [::]:80;
    server_name taredata.com www.taredata.com;

    # certbot --nginx rewrites this block to add 443 and the redirect.

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Build assets are content-hashed, so they are safe to cache forever.
        # Nothing else is — the rest of the site is ISR and Next owns its freshness.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # For the P1 websocket feed. Harmless today, one less thing to remember later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
